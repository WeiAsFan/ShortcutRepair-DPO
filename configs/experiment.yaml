project:
  name: shortcut-repair-dpo
  version: "1.1"
  generator_version: "shortcut-repair-v2"

data:
  induction_cases: 600
  dpo_cases: 600
  dev_cases: 200
  test_cases: 300
  seeds:
    induction: 8101
    dpo: 8202
    dev: 8303
    test: 9404
  audit:
    max_nuisance_accuracy: 0.55

model:
  name_or_path: Qwen/Qwen2.5-1.5B-Instruct
  revision: 989aa7980e4cf806f80c7fef2b1adb7bc71aa306
  local_path: models/Qwen2.5-1.5B-Instruct
  max_length: 512
  dtype: bfloat16

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

sft:
  seed: 1337
  learning_rate: 2.0e-4
  epochs: 1
  micro_batch_size: 4
  gradient_accumulation_steps: 8
  warmup_ratio: 0.05
  weight_decay: 0.0
  max_grad_norm: 1.0
  logging_steps: 5
  save_steps: 50
  expected_rows: 1200
  expected_optimizer_steps: 38

dpo:
  seeds: [42, 43, 44]
  beta: 0.1
  loss_type: sigmoid
  learning_rate: 1.0e-5
  epochs: 3
  micro_batch_size: 4
  gradient_accumulation_steps: 8
  warmup_ratio: 0.05
  weight_decay: 0.0
  max_grad_norm: 1.0
  logging_steps: 5
  save_steps: 40
  expected_rows: 1200
  expected_optimizer_steps: 114
  smoke_rows: 64
  smoke_steps: 2

counterfactual_sft:
  seeds: [42, 43, 44]
  learning_rate: 1.0e-5
  epochs: 3
  micro_batch_size: 4
  gradient_accumulation_steps: 8
  warmup_ratio: 0.05
  weight_decay: 0.0
  max_grad_norm: 1.0
  logging_steps: 5
  save_steps: 40
  expected_rows: 1200
  expected_optimizer_steps: 114
  smoke_rows: 64
  smoke_steps: 2

evaluation:
  batch_size: 16
  generation_max_new_tokens: 4
  bootstrap_samples: 10000
  bootstrap_seed: 20260828
  mechanism_gate:
    min_aligned_accuracy: 0.80
    max_conflict_accuracy: 0.20
    min_hint_flip_rate: 0.80
    min_causal_hint_effect: 1.0
  success:
    min_conflict_delta: 0.10
    max_hint_flip_ratio: 0.50
    max_aligned_accuracy_drop: 0.02
    min_fresh_result_response: 0.80
    min_nuisance_invariance: 0.95
    min_greedy_exact_format: 0.98

paths:
  data_dir: data
  shortcut_dir: runs/shortcut
  dpo_runs_dir: runs/dpo
  sft_baseline_runs_dir: runs/sft_baseline
  results_dir: results
  reports_dir: reports
