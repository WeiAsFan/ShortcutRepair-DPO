project:
  version: "1.3"
  generator_version: shortcut-repair-v12-reuse-v13-anchor

data:
  # train/dev 与 v1.2 逐字节一致；test 使用新 seed，且仅在 pilot 通过后生成。
  train_cases: 640
  dev_cases: 256
  test_cases: 320
  score_fraction: 0.75
  seeds: {train: 12021, dev: 12022, test: 13023}

seeds: [42, 43, 44]

model:
  name_or_path: Qwen/Qwen2.5-1.5B-Instruct
  revision: 989aa7980e4cf806f80c7fef2b1adb7bc71aa306
  local_path: models/Qwen2.5-1.5B-Instruct
  max_length: 512

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

training:
  micro_batch_size: 4
  gradient_accumulation_steps: 8
  warmup_ratio: 0.05
  weight_decay: 0.0
  max_grad_norm: 1.0
  logging_steps: 5
  save_steps: 40

sft:
  learning_rate: 1.0e-5
  epochs: 1

dpo:
  learning_rate: 1.0e-5
  epochs: 3
  beta: 0.1
  loss_type: sigmoid

anchor:
  learning_rate: 2.0e-6
  epochs: 1

pilot:
  min_aligned_accuracy: 0.90
  min_validity_conflict_accuracy: 0.95
  min_score_conflict_accuracy: 0.95
  min_score_fresh_response: 0.95
  min_score_nuisance_invariance: 0.95
  min_greedy_exact_format: 0.98
  min_format_gain: 0.02
  max_core_regression: 0.02

evaluation:
  batch_size: 16
  generation_max_new_tokens: 4
  bootstrap_samples: 10000
  bootstrap_seed: 20260903
  success:
    min_score_fresh_response: 0.70
    min_score_conflict_accuracy: 0.70
    min_aligned_accuracy: 0.90
    min_validity_conflict_accuracy: 0.95
    min_score_nuisance_invariance: 0.95
    min_greedy_exact_format: 0.98

v12_pilot:
  git_sha: 7047d067bf464e1ffbb4896a7f27103471bdec3b
